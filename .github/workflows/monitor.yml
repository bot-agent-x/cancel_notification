name: Therapist Availability Monitor

on:
  workflow_dispatch:  # Run only when started manually

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # GitHub-hosted runner job limit
    strategy:
      fail-fast: false
      max-parallel: 1  # Run segments one after another: 4 x 6h = 24h
      matrix:
        segment: [1, 2, 3, 4]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Restore state from previous segment
      if: matrix.segment != 1
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: availability-state

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright browsers
      run: |
        playwright install chromium

    - name: Run monitor
      env:
        LOGIN_URL: ${{ secrets.LOGIN_URL }}
        LOGIN_ID: ${{ secrets.LOGIN_ID }}
        PASSWORD: ${{ secrets.PASSWORD }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        TARGETS_JSON: ${{ secrets.TARGETS_JSON }}
      run: |
        python -u monitor.py

    - name: Save state for next segment
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: availability-state
        path: availability_state.json
        overwrite: true
        if-no-files-found: ignore
